name: Build portable Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test launch correlation and placement
        run: dotnet test tests/LaunchMonitor.Core.Tests --configuration Release
      - name: Build portable app
        shell: pwsh
        run: ./scripts/Publish.ps1 -Runtime ${{ matrix.runtime }}
      - name: Smoke-test Windows tray startup and native hooks
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $app = Start-Process ./artifacts/LaunchMonitor-win-x64/LaunchMonitor.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(30000)) {
            $app.Kill()
            throw 'LaunchMonitor did not exit its startup check.'
          }
          if ($app.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/LaunchMonitor/errors.log" -ErrorAction SilentlyContinue
            throw "Startup check failed: $($app.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchMonitor-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish portable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* --title "LaunchMonitor $RELEASE_TAG" --generate-notes "${release_flags[@]}"
